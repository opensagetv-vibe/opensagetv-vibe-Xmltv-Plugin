name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check plugin metadata, package boundaries and source integrity
        run: |
          python scripts/package.py validate
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/project_manifest.py --check
      - name: Validate source layout and scripts
        run: |
          set -euo pipefail
          test -x dev.sh
          test -x update.sh
          test -x scripts/build.sh
          find . -type f -name '*.sh' -not -path './.git/*' -print0 | xargs -0 bash -n
          test -f LICENSE
          test -f THIRD_PARTY_NOTICES.md
          test -f SAGETV_SERVER_ROOT_Contents/xmltv_src/XMLTVImportPlugin.java
          test -f SAGETV_SERVER_ROOT_Contents/xmltv_OTA_Local.profile
          ! grep -R -n -E '192\.168\.|xmltv_60177|nyplayer_epgdata' \
            --exclude-dir=.git --exclude-dir=.github --exclude-dir=artifacts --exclude-dir=output .
